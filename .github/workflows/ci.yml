name: Foundation CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify GCP infrastructure contract
        run: pnpm infra:check
      - name: Verify private beta readiness
        run: pnpm readiness:check
      - name: Scan repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          readonly gitleaks_version='8.30.1'
          readonly gitleaks_sha256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          readonly archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${archive}" \
            --output "/tmp/${archive}"
          echo "${gitleaks_sha256}  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp gitleaks
          /tmp/gitleaks git --redact --exit-code 1 .
      - run: pnpm security:secrets
      - run: pnpm audit --audit-level high
      - run: pnpm env:init
      - run: docker compose --env-file .env.local -f infrastructure/compose.yaml config --quiet
      - name: Start PostgreSQL
        run: timeout 120s pnpm db:up
      - run: pnpm db:migrate
      - name: Backup and isolated restore drill
        run: timeout 180s pnpm db:restore-drill
      - name: PostgreSQL integration
        run: |
          set -a
          source .env.local
          set +a
          export TEST_DATABASE_URL="$DATABASE_URL"
          pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E browser journey
        run: timeout 180s pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: backup-restore-manifest
          path: .local/backups/*.manifest.json
          retention-days: 30
      - run: if test -f .env.local; then timeout 60s pnpm db:down; fi
        if: always()
