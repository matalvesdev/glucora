name: Foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - run: pnpm security:secrets
      - run: pnpm audit --audit-level high
      - run: pnpm env:init
      - run: docker compose --env-file .env.local -f infrastructure/compose.yaml config --quiet
      - run: pnpm db:up
      - run: pnpm db:migrate
      - name: Backup and isolated restore drill
        run: pnpm db:restore-drill
      - name: PostgreSQL integration
        run: |
          set -a
          source .env.local
          set +a
          export TEST_DATABASE_URL="$DATABASE_URL"
          pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: backup-restore-manifest
          path: .local/backups/*.manifest.json
          retention-days: 30
      - run: if test -f .env.local; then pnpm db:down; fi
        if: always()
