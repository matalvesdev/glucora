name: CodeQL
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: JavaScript and TypeScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@7999b86c43a865dc79d8923397f35af22de63401
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401
        with:
          category: /language:javascript-typescript
